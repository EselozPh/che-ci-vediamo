<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Che ci vediamo?</title>
<style>
:root{--bg:#fff;--fg:#101010;--mut:#707070;--line:#dedede;--soft:#f5f5f3;--accent:#101010;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color-scheme:light}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;padding:20px 18px calc(42px + env(safe-area-inset-bottom));font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}.wrap{max-width:620px;margin:auto}header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;border-bottom:2px solid var(--fg);padding-bottom:17px;margin-bottom:25px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:48px;height:48px}h1{font:700 2rem/1 var(--serif);letter-spacing:-.03em;margin:0}.subtitle{font-size:12px;color:var(--mut);margin:6px 0 0}.counter{font-size:12px;color:var(--mut);text-align:right;line-height:1.45}.card{margin-bottom:27px}.label{font-size:10px;font-weight:750;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}.search-row{display:flex;gap:9px}.search-row input{flex:1;margin:0}input,select{width:100%;min-width:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;padding:12px 2px;margin-bottom:8px;outline:0}input:focus,select:focus{border-bottom-color:var(--fg)}input::placeholder{color:var(--mut)}button{border:1px solid var(--fg);border-radius:999px;background:var(--fg);color:var(--bg);padding:12px 17px;font:600 13px inherit;cursor:pointer;touch-action:manipulation}button:active{opacity:.7}button:disabled{opacity:.4;cursor:wait}.ghost{background:transparent;color:var(--fg)}.small{padding:8px 12px;font-size:12px;white-space:nowrap}.msg{font-size:13px;font-weight:600;margin:9px 0;color:var(--fg)}.error{text-decoration:underline;text-underline-offset:3px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.form-grid .full{grid-column:1/-1}#btn-save{width:100%;margin-top:10px;padding:15px}.results{display:none;border-top:1px solid var(--fg);margin-top:13px;max-height:52vh;overflow:auto}.result{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.poster{object-fit:cover;background:var(--soft);border:1px solid var(--line);flex:none}.result .poster{width:48px;height:70px}.info{min-width:0;flex:1;font-size:12px;line-height:1.42}.info strong{font:700 16px/1.15 var(--serif);display:block;overflow-wrap:anywhere}.muted{color:var(--mut)}.result .pick{width:38px;height:38px;padding:0;background:transparent;color:var(--fg);border:0;font-size:27px;font-weight:300}.result .pick.done{font-size:20px;font-weight:700}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;background:transparent;color:var(--mut);border-color:var(--line);padding:10px 8px}.tab.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.toolbar button{font-size:12px}.item{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.item-main{display:flex;align-items:center;gap:14px;min-width:0;flex:1;cursor:pointer}.item .poster{width:61px;height:88px}.item-info{min-width:0}.title{font:700 18px/1.17 var(--serif);margin:0 0 5px;overflow-wrap:anywhere}.meta{font-size:13px;color:var(--mut);margin:0 0 6px;overflow-wrap:anywhere}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:10px;margin:2px 4px 0 0}.item-actions{display:flex;flex-direction:column;gap:6px}.icon-btn{border:0;background:transparent;color:var(--fg);padding:5px 2px;font-size:19px;line-height:1}.icon-btn.watched{opacity:.42}.empty{padding:38px 16px;text-align:center;color:var(--mut);font-size:13px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.open{display:flex}.modal-content{background:var(--bg);width:100%;max-width:620px;max-height:92dvh;overflow:auto;padding:24px 22px calc(24px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}.modal h2{font:700 26px/1.1 var(--serif);margin:0 0 5px}.modal-top{display:flex;justify-content:space-between;gap:10px}.modal-poster{width:112px;height:164px}.modal-body{display:flex;gap:17px;margin-top:18px}.modal .row{font-size:13px;margin:0 0 9px}.modal .row b{display:block;color:var(--mut);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}.modal-desc{font-size:14px;line-height:1.6;margin:20px 0 0}.close{width:100%;margin-top:22px}@media(max-width:390px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div><h1>Che ci vediamo?</h1><p class="subtitle">Per non buttare le serate</p></div></div><div id="counter" class="counter">0 titoli<br>da vedere</div></header>
<section class="card"><p class="label">Aggiungi qualcosa</p><div class="search-row"><input id="query" type="search" placeholder="Cerca un film o una serie TV" autocomplete="off" enterkeyhint="search"><button id="search" class="small">Cerca</button></div><div id="message" role="status" aria-live="polite"></div><div id="results" class="results"><p class="label" style="margin:12px 0 0">Risultati</p><div id="result-list"></div></div><div class="form-grid"><input id="title" class="full" type="text" placeholder="Titolo"><select id="type"><option value="movie">Film</option><option value="series">Serie TV</option></select><input id="year" type="number" placeholder="Anno" inputmode="numeric"><input id="creator" type="text" placeholder="Regia / creatori"><input id="genre" type="text" placeholder="Genere"><input id="cover" class="full" type="url" placeholder="URL locandina (opzionale)"><input id="notes" class="full" type="text" placeholder="Note (dove vederlo, con chi...)" /></div><button id="save">Aggiungi alla lista</button></section>
<section><p class="label">La tua lista</p><div class="tabs"><button class="tab active" data-tab="movies">Film <span id="movie-count">0</span></button><button class="tab" data-tab="series">Serie TV <span id="series-count">0</span></button></div><div class="toolbar"><button id="export" class="ghost small">Esporta backup</button><button id="import" class="ghost small">Importa backup</button><input id="file" type="file" accept="application/json,.json" hidden></div><input id="filter" type="search" placeholder="Filtra la lista"><div style="display:flex;align-items:center;gap:8px"><span class="muted" style="font-size:12px">Ordina</span><select id="sort" style="margin:0;font-size:14px"><option value="new">Più recenti</option><option value="title">Titolo A-Z</option><option value="old">Meno recenti</option><option value="year">Anno</option></select></div></section>
<div id="items"></div>
</div>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="modal-content"><div class="modal-top"><div><h2 id="m-title"></h2><p id="m-sub" class="muted" style="margin:0;font-size:14px"></p></div><button id="close-x" class="ghost small" aria-label="Chiudi" style="font-size:22px;padding:0 8px;border:0">×</button></div><div class="modal-body"><img id="m-cover" class="poster modal-poster" alt="Locandina"><div><p class="row"><b>Tipo</b><span id="m-type"></span></p><p class="row"><b>Anno</b><span id="m-year"></span></p><p class="row"><b>Genere</b><span id="m-genre"></span></p><p class="row"><b>Creatori</b><span id="m-creator"></span></p><p class="row"><b>Stato</b><span id="m-status"></span></p></div></div><p id="m-notes" class="modal-desc" style="font-style:italic;color:var(--mut);display:none"></p><div id="note-editor" style="margin-top:18px"><label class="label" for="m-edit-notes">Nota personale <span id="note-count" style="float:right;letter-spacing:0;text-transform:none;font-weight:400">0/360</span></label><textarea id="m-edit-notes" maxlength="360" rows="3" placeholder="Stagione, piattaforma, dove trovarlo..." style="width:100%;border:1px solid var(--line);padding:10px;font:inherit;resize:vertical;background:transparent;color:var(--fg)"></textarea><button id="save-note" class="small" style="margin-top:8px">Salva nota</button></div><button id="modify-note" class="ghost small" style="display:none;margin-top:12px">Modifica</button><p id="m-desc" class="modal-desc"></p><button id="close" class="ghost close">Chiudi</button></div></div>
<script>
'use strict';
const KEY='che_ci_vediamo_v1';let entries=load(),activeTab='movies',lastResults=[],controller=null;
const $=id=>document.getElementById(id);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x.filter(Boolean).map(e=>{if(e&&e.season&&!e.notes)e.notes='Stagione '+e.season;delete e.season;return e}):[]}catch{return[]}}
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch{message('Impossibile salvare: memoria del browser piena.',true);return false}}
function message(text,error=false){$('message').textContent=text||'';$('message').className=text?'msg'+(error?' error':''):''}
function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function safeUrl(v){try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)?u.href.replace(/^http:/,'https:'):''}catch{return''}}
function year(v){const m=String(v||'').match(/\d{4}/);return m?m[0]:''}
function fallback(title){const ch=(String(title||'?').trim()[0]||'?').toUpperCase();return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="290"><rect width="100%" height="100%" fill="#111"/><rect x="14" y="14" width="172" height="262" fill="none" stroke="#fff"/><text x="50%" y="56%" text-anchor="middle" fill="#fff" font-family="Georgia" font-size="82">${ch.replace(/[<&]/g,'')}</text></svg>`)}
function setImg(img,url,title){img.src=safeUrl(url)||fallback(title);img.onerror=()=>{img.onerror=null;img.src=fallback(title)}}
function apiUrl(q,type){return `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&country=it&limit=30&media=${type==='movie'?'movie':'tvShow'}&entity=${type==='movie'?'movie':'tvShow'}`}
async function searchImdbMovies(q,signal){const r=await fetch('https://v3.sg.media-imdb.com/suggestion/x/'+encodeURIComponent(q)+'.json',{signal});const d=await r.json();return (d.d||[]).filter(x=>x.qid==='movie'||x.q==='feature').map(toImdbMovie)}
function toImdbMovie(x){return{id:'imdb-'+String(x.id||''),title:x.l||'',type:'movie',year:year(x.y||x.tl),creator:x.s||'',genre:'Film',cover:safeUrl(x.i&&x.i.imageUrl||''),description:''}}
async function searchWikipediaMovies(q,signal){const makeUrl=lang=>'https://'+lang+'.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q+' film')+'&gsrnamespace=0&gsrlimit=12&prop=pageimages%7Cextracts&piprop=thumbnail&pithumbsize=600&exintro=1&explaintext=1&format=json&origin=*';async function get(lang){const r=await fetch(makeUrl(lang),{signal});const d=await r.json();return Object.values((d.query&&d.query.pages)||{}).filter(x=>x.title&&/film|movie|pellicola/i.test(String(x.extract||''))).map(x=>toWikipediaMovie(x,lang))}const it=await get('it');return it.length?it:await get('en')}
function toWikipediaMovie(x,lang){return{id:'wiki-'+lang+'-'+String(x.pageid||''),title:x.title,type:'movie',year:year(x.extract),creator:'',genre:'Film',cover:safeUrl(x.thumbnail&&x.thumbnail.source||''),description:String(x.extract||'').trim()}}
async function search(){const q=$('query').value.trim();if(!q)return message('Scrivi un titolo da cercare.',true);if(controller)controller.abort();controller=new AbortController();$('search').disabled=true;$('search').textContent='…';message('Cerco tra film e serie TV…');try{const [m,s,tv,imdb,wiki]=await Promise.all([fetch(apiUrl(q,'movie'),{signal:controller.signal}).then(r=>r.json()).catch(()=>({results:[]})),fetch(apiUrl(q,'series'),{signal:controller.signal}).then(r=>r.json()).catch(()=>({results:[]})),fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q),{signal:controller.signal}).then(r=>r.json()).catch(()=>[]),searchImdbMovies(q,controller.signal).catch(()=>[]),searchWikipediaMovies(q,controller.signal).catch(()=>[])]);const tvResults=(tv||[]).map(x=>toTvResult(x.show)).filter(x=>x.title);lastResults=[...(wiki||[]),...(imdb||[]),...(m.results||[]).map(x=>toResult(x,'movie')),...(s.results||[]).map(x=>toResult(x,'series')), ...tvResults];const seen=new Set();lastResults=lastResults.filter(x=>{const k=x.type+'|'+norm(x.title);if(seen.has(k))return false;seen.add(k);return true});renderResults(lastResults);message(lastResults.length?`Trovate ${lastResults.length} schede. Tocca + per scegliere.`:'Nessun risultato: puoi compilare la scheda a mano.',!lastResults.length)}catch(e){if(e.name!=='AbortError')message('Ricerca non disponibile. Puoi comunque aggiungere una scheda a mano.',true)}finally{$('search').disabled=false;$('search').textContent='Cerca'}}
function toTvResult(x){return{id:'tv-'+String(x.id||''),title:x.name||'',type:'series',year:year(x.premiered),creator:(x.network&&x.network.name)||'',genre:Array.isArray(x.genres)?x.genres.slice(0,2).join(', '):'',cover:safeUrl(x.image&&(x.image.original||x.image.medium)||''),description:String(x.summary||'').replace(/<[^>]*>/g,' ').trim()}}
function toResult(x,type){return{id:String(x.trackId||x.collectionId||Math.random()),title:x.trackName||x.collectionName||'',type,year:year(x.releaseDate),creator:type==='movie'?(x.artistName||''):(x.artistName||''),genre:x.primaryGenreName||'',cover:safeUrl(String(x.artworkUrl100||'').replace('100x100','600x600')),description:String(x.longDescription||x.shortDescription||x.description||'').replace(/<[^>]*>/g,' ').trim()}}
function renderResults(rs){const box=$('results'),list=$('result-list');list.replaceChildren();if(!rs.length){box.style.display='none';return}box.style.display='block';rs.forEach(r=>{const row=document.createElement('div');row.className='result';const img=document.createElement('img');img.className='poster';img.alt='';setImg(img,r.cover,r.title);const info=document.createElement('div');info.className='info';const strong=document.createElement('strong');strong.textContent=r.title;const meta=document.createElement('div');meta.className='muted';meta.textContent=[r.type==='movie'?'Film':'Serie TV',r.year,r.genre,r.creator].filter(Boolean).join(' · ');info.append(strong,meta);const b=document.createElement('button');b.className='pick';b.textContent='+';b.setAttribute('aria-label','Aggiungi '+r.title);if(entries.some(e=>norm(e.title)===norm(r.title)&&e.type===r.type)){b.textContent='✓';b.classList.add('done')}b.onclick=()=>addResult(r);row.append(img,info,b);list.append(row)})}
function makeEntry(data){return{id:crypto.randomUUID?crypto.randomUUID():Date.now()+'',title:data.title,type:data.type,year:data.year||'',creator:data.creator||'',genre:data.genre||'',cover:safeUrl(data.cover||''),notes:data.notes||'',description:data.description||'',watched:false,created:Date.now()}}
function addResult(r){if(entries.some(e=>norm(e.title)===norm(r.title)&&e.type===r.type))return message('Questo titolo è già nella lista.',true);const item=makeEntry(r);entries.unshift(item);if(saveData()){activeTab=item.type==='movie'?'movies':'series';render();message(`${item.title} aggiunto alla lista.`)}}
function add(){const title=$('title').value.trim(),type=$('type').value;if(!title)return message('Inserisci almeno un titolo.',true);if(entries.some(e=>norm(e.title)===norm(title)&&e.type===type))return message('Questo titolo è già nella lista.',true);const item=makeEntry({title,type,year:$('year').value.trim(),creator:$('creator').value.trim(),genre:$('genre').value.trim(),cover:$('cover').value.trim(),notes:$('notes').value.trim()});entries.unshift(item);if(saveData()){clearForm();activeTab=type==='movie'?'movies':'series';render();message(`${title} aggiunto alla lista.`)}}
function clearForm(){['title','year','creator','genre','cover','notes'].forEach(id=>$(id).value='')}
function render(){const movies=entries.filter(e=>e.type==='movie'),series=entries.filter(e=>e.type==='series');$('counter').innerHTML=`${entries.length} titol${entries.length===1?'o':'i'}<br>da vedere`;$('movie-count').textContent=movies.length;$('series-count').textContent=series.length;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));const q=norm($('filter').value),sort=$('sort').value;let list=entries.filter(e=>e.type===(activeTab==='movies'?'movie':'series')).filter(e=>!q||norm([e.title,e.creator,e.genre,e.notes].join(' ')).includes(q));list.sort((a,b)=>sort==='title'?norm(a.title).localeCompare(norm(b.title),'it'):(sort==='old'?a.created-b.created:sort==='year'?String(a.year||'9999').localeCompare(String(b.year||'9999')):b.created-a.created));const root=$('items');root.replaceChildren();if(!list.length){root.innerHTML='<div class="empty">Niente qui per ora.<br>Cerca un titolo sopra e salvalo per le prossime serate.</div>';return}list.forEach(e=>root.appendChild(itemNode(e)))}
function itemNode(e){const row=document.createElement('article');row.className='item';const main=document.createElement('div');main.className='item-main';const img=document.createElement('img');img.className='poster';img.alt='';img.loading='lazy';setImg(img,e.cover,e.title);const info=document.createElement('div');info.className='item-info';const title=document.createElement('p');title.className='title';title.textContent=e.title;const meta=document.createElement('p');meta.className='meta';meta.textContent=[e.year,e.creator].filter(Boolean).join(' · ');const tags=document.createElement('div');if(e.genre){const t=document.createElement('span');t.className='tag';t.textContent=e.genre;tags.append(t)}if(e.watched){const t=document.createElement('span');t.className='tag';t.textContent='Già visto';tags.append(t)}info.append(title,meta,tags);main.append(img,info);main.onclick=()=>openModal(e);const actions=document.createElement('div');actions.className='item-actions';const watch=document.createElement('button');watch.className='icon-btn'+(e.watched?' watched':'');watch.textContent=e.watched?'✓':'○';watch.title=e.watched?'Segna da vedere':'Segna come visto';watch.onclick=()=>{e.watched=!e.watched;saveData();render()};const del=document.createElement('button');del.className='icon-btn';del.textContent='×';del.title='Rimuovi';del.onclick=()=>{if(confirm(`Rimuovere “${e.title}”?`)){entries=entries.filter(x=>x.id!==e.id);saveData();render()}};actions.append(watch,del);row.append(main,actions);return row}
let modalEntry=null;
function updateNoteCount(){const n=$('m-edit-notes').value.length;$('note-count').textContent=n+'/360'}
function openModal(e){modalEntry=e;$('m-title').textContent=e.title;$('m-sub').textContent=e.type==='series'?'Serie TV':'Film';setImg($('m-cover'),e.cover,e.title);$('m-type').textContent=e.type==='series'?'Serie TV':'Film';$('m-year').textContent=e.year||'—';$('m-genre').textContent=e.genre||'—';$('m-creator').textContent=e.creator||'—';$('m-status').textContent=e.watched?'Già visto':'Da vedere';const hasNote=Boolean((e.notes||'').trim());$('m-notes').textContent=hasNote?`Nota: ${e.notes}`:'';$('m-notes').style.display=hasNote?'block':'none';$('m-edit-notes').value=e.notes||'';$('note-editor').style.display=hasNote?'none':'block';$('modify-note').style.display=hasNote?'inline-block':'none';updateNoteCount();$('m-desc').textContent=e.description||'';$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
$('search').onclick=search;$('query').onkeydown=e=>{if(e.key==='Enter')search()};$('save').onclick=add;$('filter').oninput=render;$('sort').onchange=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()});$('close').onclick=closeModal;$('close-x').onclick=closeModal;$('m-edit-notes').oninput=updateNoteCount;$('modify-note').onclick=()=>{$('note-editor').style.display='block';$('modify-note').style.display='none';$('m-edit-notes').focus()};$('save-note').onclick=()=>{if(!modalEntry)return;modalEntry.notes=$('m-edit-notes').value.trim().slice(0,360);saveData();render();openModal(modalEntry);message(modalEntry.notes?'Nota salvata.':'Nota rimossa.')};$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Che ci vediamo?',version:1,entries},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='che-ci-vediamo-backup.json';a.click();URL.revokeObjectURL(a.href)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text()),incoming=Array.isArray(d)?d:d.entries;if(!Array.isArray(incoming))throw Error();entries=incoming.filter(x=>x&&x.title&&x.type);saveData();render();message(`Importati ${entries.length} elementi.`)}catch{message('Backup non valido.',true)}e.target.value=''};
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
